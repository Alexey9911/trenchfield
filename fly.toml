# TrenchField realtime server — single always-on machine (escrow + lobbies live
# in RAM: never scale count > 1; multi-region = separate apps).
app = "trenchfield-server"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8123"

[http_service]
  internal_port = 8123
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
